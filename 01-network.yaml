AWSTemplateFormatVersion: '2010-09-09'
Description: VPC with public/private subnets across 2 AZ, no NAT Gateway, all egress via VPC endpoints

Parameters:
  ProjectName:
    Type: String
    Default: ddb-cache-lab

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsHostnames: true   # REQUIRED for Interface Endpoint Private DNS
      EnableDnsSupport: true     # REQUIRED for Interface Endpoint Private DNS
      Tags: [{Key: Name, Value: !Sub "${ProjectName}-vpc"}]

  IGW:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{Key: Name, Value: !Sub "${ProjectName}-igw"}]
  AttachIGW:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: {VpcId: !Ref VPC, InternetGatewayId: !Ref IGW}

  # === Public subnets - only ALB ===
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags: [{Key: Name, Value: !Sub "${ProjectName}-public-a"}]
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.20.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags: [{Key: Name, Value: !Sub "${ProjectName}-public-b"}]

  # === Private subnets - no internet route ===
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.20.11.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags: [{Key: Name, Value: !Sub "${ProjectName}-private-a"}]
  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.20.12.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags: [{Key: Name, Value: !Sub "${ProjectName}-private-b"}]

  # === Public route table - has route to IGW ===
  PublicRT:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref VPC}
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachIGW
    Properties:
      RouteTableId: !Ref PublicRT
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref IGW
  PublicRTAssocA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {RouteTableId: !Ref PublicRT, SubnetId: !Ref PublicSubnetA}
  PublicRTAssocB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {RouteTableId: !Ref PublicRT, SubnetId: !Ref PublicSubnetB}

  # === Private route table - no route to 0.0.0.0/0 ===
  # Only has local route + Gateway Endpoints (DynamoDB, S3) automatically add prefix list routes
  PrivateRT:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref VPC}
  PrivateRTAssocA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {RouteTableId: !Ref PrivateRT, SubnetId: !Ref PrivateSubnetA}
  PrivateRTAssocB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {RouteTableId: !Ref PrivateRT, SubnetId: !Ref PrivateSubnetB}

  # ============================================================
  # GATEWAY ENDPOINTS (FREE) - only add routes to route table
  # ============================================================

  # DynamoDB Gateway Endpoint
  DynamoDBEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.dynamodb"
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref PrivateRT]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:BatchGetItem
              - dynamodb:BatchWriteItem
              - dynamodb:DescribeTable
            Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}-*"

  # S3 Gateway Endpoint - REQUIRED for pulling ECR images (layers stored in S3)
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref PrivateRT]
      # Endpoint policy limits access to ECR buckets and optional custom buckets
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowEcrLayerPull
            Effect: Allow
            Principal: "*"
            Action:
              - s3:GetObject
            Resource:
              # ECR stores image layers in buckets with prefix "prod-${region}-starport-layer-bucket"
              - !Sub "arn:aws:s3:::prod-${AWS::Region}-starport-layer-bucket/*"

  # ============================================================
  # INTERFACE ENDPOINTS (PrivateLink) - $0.01/h/AZ + $0.01/GB
  # ============================================================

  # Security Group for all interface endpoints - allow HTTPS (443) from within VPC
  EndpointsSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTPS to VPC interface endpoints from within VPC
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 10.20.0.0/16
      Tags: [{Key: Name, Value: !Sub "${ProjectName}-endpoints-sg"}]

  # ECR API Endpoint - used for GetAuthorizationToken, DescribeImages, etc.
  EcrApiEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ecr.api"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true       # AWS SDK automatically resolves to this endpoint
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroupIds: [!Ref EndpointsSG]

  # ECR Docker Endpoint - used for docker pull (manifest, blobs)
  EcrDkrEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ecr.dkr"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroupIds: [!Ref EndpointsSG]

  # CloudWatch Logs Endpoint - used by awslogs driver
  LogsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.logs"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroupIds: [!Ref EndpointsSG]

  # Secrets Manager Endpoint - used for injecting secrets into Fargate tasks
  SecretsManagerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.secretsmanager"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroupIds: [!Ref EndpointsSG]

  # ============================================================
  # VPC FLOW LOGS
  # ============================================================
  FlowLogsGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/vpc/${ProjectName}/flowlogs"
      RetentionInDays: 7

  FlowLogsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: vpc-flow-logs.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-logs
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                Resource: !GetAtt FlowLogsGroup.Arn

  FlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      ResourceId: !Ref VPC
      ResourceType: VPC
      TrafficType: REJECT
      LogDestination: !GetAtt FlowLogsGroup.Arn
      LogDestinationType: cloud-watch-logs
      DeliverLogsPermissionArn: !GetAtt FlowLogsRole.Arn

Outputs:
  VpcId: {Value: !Ref VPC, Export: {Name: !Sub "${ProjectName}-vpc-id"}}
  PrivateSubnetA: {Value: !Ref PrivateSubnetA, Export: {Name: !Sub "${ProjectName}-private-a"}}
  PrivateSubnetB: {Value: !Ref PrivateSubnetB, Export: {Name: !Sub "${ProjectName}-private-b"}}
  PublicSubnetA: {Value: !Ref PublicSubnetA, Export: {Name: !Sub "${ProjectName}-public-a"}}
  PublicSubnetB: {Value: !Ref PublicSubnetB, Export: {Name: !Sub "${ProjectName}-public-b"}}
  EndpointsSG:   {Value: !Ref EndpointsSG,   Export: {Name: !Sub "${ProjectName}-endpoints-sg"}}