# GitHub Actions workflow for Kicks Shoes Backend Deployment
# Deploys Node.js backend to Azure App Service

name: Deploy Backend to Azure

on:
  push:
    branches:
      - kicks-develop
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/kicks-develop_kicks-shoes-backend.yml'
  pull_request:
    branches:
      - kicks-develop
      - main
    paths:
      - 'backend/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  NODE_VERSION: '20.x'
  BACKEND_DIR: './backend'
  AZURE_WEBAPP_NAME: 'kicks-shoes-backend'
  AZURE_RESOURCE_GROUP: 'kicks-shoes-rg'

jobs:
  # Job 1: Code Quality & Testing
  quality-check:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.BACKEND_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.BACKEND_DIR }}
        run: npm ci

      - name: Run ESLint
        working-directory: ${{ env.BACKEND_DIR }}
        run: npm run lint

      - name: Run tests
        working-directory: ${{ env.BACKEND_DIR }}
        run: npm test
        env:
          NODE_ENV: test

  # Job 2: Build & Deploy
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: [quality-check]
    if: always() && (needs.quality-check.result == 'success' || github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.BACKEND_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.BACKEND_DIR }}
        run: npm ci --production

      - name: Run tests (if not PR)
        working-directory: ${{ env.BACKEND_DIR }}
        run: npm test
        if: github.event_name != 'pull_request'
        env:
          NODE_ENV: test

      - name: Create deployment package
        run: |
          cd ${{ env.BACKEND_DIR }}
          # Remove dev dependencies and unnecessary files
          npm prune --production
          # Create zip package
          zip -r ../backend-deployment.zip . -x "node_modules/.cache/*" "*.log" "*.tmp" ".env*"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set Azure context
        run: |
          az account set --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          az configure --defaults group=${{ env.AZURE_RESOURCE_GROUP }}

      - name: Get deployment info
        id: deployment-info
        run: |
          echo "commit_sha=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "commit_message=${{ github.event.head_commit.message }}" >> $GITHUB_OUTPUT
          echo "deployment_time=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT
          echo "deployed_by=${{ github.actor }}" >> $GITHUB_OUTPUT

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: 'Production'
          package: backend-deployment.zip

      - name: Restart Azure App Service
        run: |
          az webapp restart --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }}

      - name: Wait for deployment
        run: |
          echo "Waiting for app to start..."
          sleep 30

      - name: Health check
        run: |
          echo "Performing health check..."
          response=$(curl -s -o /dev/null -w "%{http_code}" https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/health || echo "000")
          if [ "$response" = "200" ]; then
            echo "Health check passed!"
          else
            echo "Health check failed with status: $response"
            echo "Checking app logs..."
            az webapp log tail --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --provider application
            exit 1
          fi

      - name: Deployment summary
        run: |
          echo "Deployment completed successfully!"
          echo "Deployment Details:"
          echo "  - Commit: ${{ steps.deployment-info.outputs.commit_sha }}"
          echo "  - Message: ${{ steps.deployment-info.outputs.commit_message }}"
          echo "  - Deployed by: ${{ steps.deployment-info.outputs.deployed_by }}"
          echo "  - Time: ${{ steps.deployment-info.outputs.deployment_time }}"
          echo "  - Environment: ${{ github.event.inputs.environment || 'production' }}"
          echo ""
          echo "URLs:"
          echo "  - App: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          echo "  - API: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/api"
          echo "  - Health: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/health"

  # Job 3: Notifications (Optional)
  notify:
    name: Notifications
    runs-on: ubuntu-latest
    needs: [build-and-deploy]
    if: always()

    steps:
      - name: Deployment notification
        run: |
          if [ "${{ needs.build-and-deploy.result }}" = "success" ]; then
            echo "Deployment successful!"
            echo "Backend deployed to: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          else
            echo "Deployment failed!"
            echo "Check the logs for details"
          fi
