# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - kicks-shoes-backend

on:
  push:
    branches:
      - feature/deploy-tientp
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: npm install and test
        run: |
          cd backend
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Prepare production build
        run: |
          cd backend
          # Clean install production dependencies only
          rm -rf node_modules
          npm ci --omit=dev
          # Remove unnecessary files
          rm -rf .git .env.example

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A581FB5323D24DB9B36E2ECA05B5CE40 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_ABB59C856ED54947B8A15256E63B7375 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_94E00768217342F1BC3F78314371C518 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'kicks-shoes-backend'
          slot-name: 'Production'
          package: ./backend
          restart: true

      - name: Wait for deployment to complete
        run: sleep 30
