name: AWS Production Deploy

on:
  push:
    branches:
      - kicks-production
      - main
    paths:
      - backend/**
      - infra/terraform/**
      - .github/workflows/deploy.yml
      - Dockerfile.evolution
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-production-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  APP_NAME: kicks-shoes-prod
  ECR_REPOSITORY: kicks-shoes-backend
  TF_STATE_KEY: terraform/production/kicks-shoes-prod.tfstate
  TF_WORKING_DIR: infra/terraform/environments/production
  DOCKERFILE_PATH: Dockerfile.evolution

jobs:
  deploy:
    name: Trivy Scan, Build, Push, Terraform Apply
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials (supports workshop session token)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Resolve AWS account ID
        id: aws_account
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        id: login_ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image with registry cache
        id: build_image
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.login_ecr.outputs.registry }}
          COMMIT_SHA: ${{ github.sha }}
          BASE_IMAGE_URI: ${{ secrets.BASE_IMAGE_URI }}
        run: |
          set -euo pipefail
          IMAGE_REPO="$ECR_REGISTRY/$ECR_REPOSITORY"
          IMAGE_TAG="sha-${COMMIT_SHA::12}"
          IMAGE_URI="$IMAGE_REPO:$IMAGE_TAG"

          echo "IMAGE_REPO=$IMAGE_REPO" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"
          echo "image_repo=$IMAGE_REPO" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

          docker pull "$IMAGE_REPO:latest" || true

          if [ -n "${BASE_IMAGE_URI:-}" ]; then
            docker build \
              --build-arg BASE_IMAGE_URI="$BASE_IMAGE_URI" \
              --cache-from "$IMAGE_REPO:latest" \
              -t "$IMAGE_URI" \
              -t "$IMAGE_REPO:latest" \
              -f "$DOCKERFILE_PATH" \
              .
          else
            echo "BASE_IMAGE_URI secret is empty. Falling back to backend/Dockerfile."
            docker build \
              --cache-from "$IMAGE_REPO:latest" \
              -t "$IMAGE_URI" \
              -t "$IMAGE_REPO:latest" \
              -f backend/Dockerfile \
              ./backend
          fi

      - name: Trivy image scan (HIGH/CRITICAL, non-blocking)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.build_image.outputs.image_uri }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: Push image tags to ECR
        shell: bash
        run: |
          set -euo pipefail
          docker push "${{ steps.build_image.outputs.image_uri }}"
          docker push "${{ steps.build_image.outputs.image_repo }}:latest"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init, plan and apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: bash
        env:
          TF_STATE_BUCKET_SECRET: ${{ secrets.TF_STATE_BUCKET }}
          TF_STATE_BUCKET_VAR: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_DYNAMODB_TABLE: ${{ secrets.TF_STATE_DYNAMODB_TABLE }}
          TF_STATE_KEY: ${{ env.TF_STATE_KEY }}
          ACCOUNT_ID: ${{ steps.aws_account.outputs.account_id }}
          TF_VAR_project_name: ${{ env.APP_NAME }}
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_container_image: ${{ steps.build_image.outputs.image_uri }}
          TF_VAR_dynamodb_table_name: ${{ env.APP_NAME }}
          TF_VAR_app_config_secret_arn: ${{ secrets.APP_CONFIG_SECRET_ARN }}
          TF_VAR_app_config_secret_keys: '["JWT_SECRET","JWT_REFRESH_SECRET","MONGODB_URI","GOOGLE_AI_API_KEY"]'
        run: |
          set -euo pipefail

          TF_STATE_BUCKET_EFFECTIVE="${TF_STATE_BUCKET_SECRET:-}"
          TF_STATE_BUCKET_SOURCE="secret"

          if [ -z "$TF_STATE_BUCKET_EFFECTIVE" ]; then
            TF_STATE_BUCKET_EFFECTIVE="${TF_STATE_BUCKET_VAR:-}"
            TF_STATE_BUCKET_SOURCE="variable"
          fi

          if [ -z "$TF_STATE_BUCKET_EFFECTIVE" ]; then
            TF_STATE_BUCKET_EFFECTIVE="tfstate-${ACCOUNT_ID}-${AWS_REGION}-${APP_NAME}"
            TF_STATE_BUCKET_SOURCE="generated"
          fi

          TF_STATE_BUCKET_EFFECTIVE="$(echo "$TF_STATE_BUCKET_EFFECTIVE" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9.-' | cut -c1-63)"

          if [ -z "$TF_STATE_BUCKET_EFFECTIVE" ]; then
            echo "Unable to resolve a valid TF state bucket name."
            exit 1
          fi

          echo "Using Terraform state bucket source: $TF_STATE_BUCKET_SOURCE"
          echo "Using Terraform state bucket: $TF_STATE_BUCKET_EFFECTIVE"

          if ! aws s3api head-bucket --bucket "$TF_STATE_BUCKET_EFFECTIVE" 2>/dev/null; then
            echo "State bucket does not exist. Creating $TF_STATE_BUCKET_EFFECTIVE"
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$TF_STATE_BUCKET_EFFECTIVE"
            else
              aws s3api create-bucket \
                --bucket "$TF_STATE_BUCKET_EFFECTIVE" \
                --create-bucket-configuration LocationConstraint="$AWS_REGION"
            fi

            aws s3api put-bucket-versioning \
              --bucket "$TF_STATE_BUCKET_EFFECTIVE" \
              --versioning-configuration Status=Enabled

            aws s3api put-bucket-encryption \
              --bucket "$TF_STATE_BUCKET_EFFECTIVE" \
              --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          fi

          BACKEND_ARGS=(
            "-backend-config=bucket=${TF_STATE_BUCKET_EFFECTIVE}"
            "-backend-config=key=${TF_STATE_KEY}"
            "-backend-config=region=${AWS_REGION}"
            "-backend-config=encrypt=true"
          )

          if [ -n "${TF_STATE_DYNAMODB_TABLE:-}" ]; then
            BACKEND_ARGS+=("-backend-config=dynamodb_table=${TF_STATE_DYNAMODB_TABLE}")
          fi

          terraform init -input=false "${BACKEND_ARGS[@]}"

          state_has() {
            terraform state show "$1" >/dev/null 2>&1
          }

          state_id() {
            terraform state show "$1" 2>/dev/null | sed -n 's/^id[[:space:]]*=[[:space:]]*//p' | head -n 1
          }

          normalize_none() {
            if [ "$1" = "None" ] || [ "$1" = "null" ]; then
              echo ""
            else
              echo "$1"
            fi
          }

          pick_sorted_nth() {
            local raw="$1"
            local index="$2"
            echo "$raw" | tr '\t' '\n' | sed '/^[[:space:]]*$/d' | sort | sed -n "$((index + 1))p"
          }

          ensure_import() {
            local address="$1"
            local identifier="$2"
            local current_identifier=""

            if [ -z "$identifier" ]; then
              return
            fi

            if state_has "$address"; then
              current_identifier="$(state_id "$address" || true)"
              if [ "$current_identifier" = "$identifier" ]; then
                return
              fi

              echo "State drift for $address: '$current_identifier' -> '$identifier'. Re-importing."
              terraform state rm "$address" >/dev/null 2>&1 || true
            fi

            echo "Importing $address -> $identifier"
            terraform import -input=false "$address" "$identifier" || true
          }

          APP_TABLE_NAME="${TF_VAR_dynamodb_table_name:-$APP_NAME}"

          ALB_ARN_RAW="$(aws elbv2 describe-load-balancers --names "${APP_NAME}-alb" --query 'LoadBalancers[0].LoadBalancerArn' --output text 2>/dev/null || true)"
          ALB_ARN="$(normalize_none "$ALB_ARN_RAW")"

          ALB_SG_RAW=""
          ALB_VPC_RAW=""
          if [ -n "$ALB_ARN" ]; then
            ALB_SG_RAW="$(aws elbv2 describe-load-balancers --load-balancer-arns "$ALB_ARN" --query 'LoadBalancers[0].SecurityGroups[0]' --output text 2>/dev/null || true)"
            ALB_VPC_RAW="$(aws elbv2 describe-load-balancers --load-balancer-arns "$ALB_ARN" --query 'LoadBalancers[0].VpcId' --output text 2>/dev/null || true)"
          fi
          ALB_SG_ID="$(normalize_none "$ALB_SG_RAW")"
          ALB_VPC_ID="$(normalize_none "$ALB_VPC_RAW")"

          IGW_RAW=""
          if [ -n "$ALB_VPC_ID" ]; then
            IGW_RAW="$(aws ec2 describe-internet-gateways --filters Name=attachment.vpc-id,Values="$ALB_VPC_ID" --query 'InternetGateways[0].InternetGatewayId' --output text 2>/dev/null || true)"
          fi
          IGW_ID="$(normalize_none "$IGW_RAW")"

          CLUSTER_RAW="$(aws ecs describe-clusters --clusters "${APP_NAME}-cluster" --query 'clusters[0].clusterName' --output text 2>/dev/null || true)"
          CLUSTER_NAME="$(normalize_none "$CLUSTER_RAW")"

          SERVICE_STATUS_RAW="$(aws ecs describe-services --cluster "${APP_NAME}-cluster" --services "${APP_NAME}-service" --query 'services[0].status' --output text 2>/dev/null || true)"
          SERVICE_STATUS="$(normalize_none "$SERVICE_STATUS_RAW")"

          PUBLIC_SUBNET_1_RAW=""
          PUBLIC_SUBNET_2_RAW=""
          if [ -n "$ALB_VPC_ID" ]; then
            PUBLIC_SUBNET_1_RAW="$(aws ec2 describe-subnets --filters Name=vpc-id,Values="$ALB_VPC_ID" Name=tag:Name,Values="${APP_NAME}-public-1" --query 'Subnets[0].SubnetId' --output text 2>/dev/null || true)"
            PUBLIC_SUBNET_2_RAW="$(aws ec2 describe-subnets --filters Name=vpc-id,Values="$ALB_VPC_ID" Name=tag:Name,Values="${APP_NAME}-public-2" --query 'Subnets[0].SubnetId' --output text 2>/dev/null || true)"
          fi
          PUBLIC_SUBNET_1="$(normalize_none "$PUBLIC_SUBNET_1_RAW")"
          PUBLIC_SUBNET_2="$(normalize_none "$PUBLIC_SUBNET_2_RAW")"

          if [ -n "$ALB_ARN" ] && { [ -z "$PUBLIC_SUBNET_1" ] || [ -z "$PUBLIC_SUBNET_2" ]; }; then
            ALB_SUBNETS_RAW="$(aws elbv2 describe-load-balancers --load-balancer-arns "$ALB_ARN" --query 'LoadBalancers[0].AvailabilityZones[*].SubnetId' --output text 2>/dev/null || true)"
            [ -z "$PUBLIC_SUBNET_1" ] && PUBLIC_SUBNET_1="$(pick_sorted_nth "$ALB_SUBNETS_RAW" 0)"
            [ -z "$PUBLIC_SUBNET_2" ] && PUBLIC_SUBNET_2="$(pick_sorted_nth "$ALB_SUBNETS_RAW" 1)"
          fi

          PRIVATE_SUBNET_1_RAW=""
          PRIVATE_SUBNET_2_RAW=""
          if [ -n "$ALB_VPC_ID" ]; then
            PRIVATE_SUBNET_1_RAW="$(aws ec2 describe-subnets --filters Name=vpc-id,Values="$ALB_VPC_ID" Name=tag:Name,Values="${APP_NAME}-private-1" --query 'Subnets[0].SubnetId' --output text 2>/dev/null || true)"
            PRIVATE_SUBNET_2_RAW="$(aws ec2 describe-subnets --filters Name=vpc-id,Values="$ALB_VPC_ID" Name=tag:Name,Values="${APP_NAME}-private-2" --query 'Subnets[0].SubnetId' --output text 2>/dev/null || true)"
          fi
          PRIVATE_SUBNET_1="$(normalize_none "$PRIVATE_SUBNET_1_RAW")"
          PRIVATE_SUBNET_2="$(normalize_none "$PRIVATE_SUBNET_2_RAW")"

          if [ -n "$CLUSTER_NAME" ] && [ -n "$SERVICE_STATUS" ] && [ "$SERVICE_STATUS" != "MISSING" ] && { [ -z "$PRIVATE_SUBNET_1" ] || [ -z "$PRIVATE_SUBNET_2" ]; }; then
            ECS_SUBNETS_RAW="$(aws ecs describe-services --cluster "${APP_NAME}-cluster" --services "${APP_NAME}-service" --query 'services[0].networkConfiguration.awsvpcConfiguration.subnets' --output text 2>/dev/null || true)"
            [ -z "$PRIVATE_SUBNET_1" ] && PRIVATE_SUBNET_1="$(pick_sorted_nth "$ECS_SUBNETS_RAW" 0)"
            [ -z "$PRIVATE_SUBNET_2" ] && PRIVATE_SUBNET_2="$(pick_sorted_nth "$ECS_SUBNETS_RAW" 1)"
          fi

          PUBLIC_RT_RAW=""
          if [ -n "$ALB_VPC_ID" ]; then
            PUBLIC_RT_RAW="$(aws ec2 describe-route-tables --filters Name=vpc-id,Values="$ALB_VPC_ID" Name=tag:Name,Values="${APP_NAME}-public-rt" --query 'RouteTables[0].RouteTableId' --output text 2>/dev/null || true)"
          fi
          PUBLIC_RT_ID="$(normalize_none "$PUBLIC_RT_RAW")"

          if [ -z "$PUBLIC_RT_ID" ] && [ -n "$PUBLIC_SUBNET_1" ]; then
            PUBLIC_RT_RAW="$(aws ec2 describe-route-tables --filters Name=association.subnet-id,Values="$PUBLIC_SUBNET_1" --query 'RouteTables[0].RouteTableId' --output text 2>/dev/null || true)"
            PUBLIC_RT_ID="$(normalize_none "$PUBLIC_RT_RAW")"
          fi

          PRIVATE_RT_1_RAW=""
          PRIVATE_RT_2_RAW=""
          if [ -n "$ALB_VPC_ID" ]; then
            PRIVATE_RT_1_RAW="$(aws ec2 describe-route-tables --filters Name=vpc-id,Values="$ALB_VPC_ID" Name=tag:Name,Values="${APP_NAME}-private-1" --query 'RouteTables[0].RouteTableId' --output text 2>/dev/null || true)"
            PRIVATE_RT_2_RAW="$(aws ec2 describe-route-tables --filters Name=vpc-id,Values="$ALB_VPC_ID" Name=tag:Name,Values="${APP_NAME}-private-2" --query 'RouteTables[0].RouteTableId' --output text 2>/dev/null || true)"
          fi
          PRIVATE_RT_1_ID="$(normalize_none "$PRIVATE_RT_1_RAW")"
          PRIVATE_RT_2_ID="$(normalize_none "$PRIVATE_RT_2_RAW")"

          if [ -z "$PRIVATE_RT_1_ID" ] && [ -n "$PRIVATE_SUBNET_1" ]; then
            PRIVATE_RT_1_RAW="$(aws ec2 describe-route-tables --filters Name=association.subnet-id,Values="$PRIVATE_SUBNET_1" --query 'RouteTables[0].RouteTableId' --output text 2>/dev/null || true)"
            PRIVATE_RT_1_ID="$(normalize_none "$PRIVATE_RT_1_RAW")"
          fi

          if [ -z "$PRIVATE_RT_2_ID" ] && [ -n "$PRIVATE_SUBNET_2" ]; then
            PRIVATE_RT_2_RAW="$(aws ec2 describe-route-tables --filters Name=association.subnet-id,Values="$PRIVATE_SUBNET_2" --query 'RouteTables[0].RouteTableId' --output text 2>/dev/null || true)"
            PRIVATE_RT_2_ID="$(normalize_none "$PRIVATE_RT_2_RAW")"
          fi

          NAT_GW_1_RAW=""
          NAT_GW_2_RAW=""
          if [ -n "$ALB_VPC_ID" ]; then
            NAT_GW_1_RAW="$(aws ec2 describe-nat-gateways --filter Name=vpc-id,Values="$ALB_VPC_ID" Name=tag:Name,Values="${APP_NAME}-nat-1" Name=state,Values=available,pending --query 'NatGateways[0].NatGatewayId' --output text 2>/dev/null || true)"
            NAT_GW_2_RAW="$(aws ec2 describe-nat-gateways --filter Name=vpc-id,Values="$ALB_VPC_ID" Name=tag:Name,Values="${APP_NAME}-nat-2" Name=state,Values=available,pending --query 'NatGateways[0].NatGatewayId' --output text 2>/dev/null || true)"
          fi
          NAT_GW_1_ID="$(normalize_none "$NAT_GW_1_RAW")"
          NAT_GW_2_ID="$(normalize_none "$NAT_GW_2_RAW")"

          if [ -n "$ALB_VPC_ID" ] && { [ -z "$NAT_GW_1_ID" ] || [ -z "$NAT_GW_2_ID" ]; }; then
            NAT_GW_ALL_RAW="$(aws ec2 describe-nat-gateways --filter Name=vpc-id,Values="$ALB_VPC_ID" Name=state,Values=available,pending --query 'NatGateways[*].NatGatewayId' --output text 2>/dev/null || true)"
            [ -z "$NAT_GW_1_ID" ] && NAT_GW_1_ID="$(pick_sorted_nth "$NAT_GW_ALL_RAW" 0)"
            [ -z "$NAT_GW_2_ID" ] && NAT_GW_2_ID="$(pick_sorted_nth "$NAT_GW_ALL_RAW" 1)"
          fi

          NAT_EIP_1_RAW=""
          NAT_EIP_2_RAW=""
          if [ -n "$ALB_VPC_ID" ]; then
            NAT_EIP_1_RAW="$(aws ec2 describe-addresses --filters Name=domain,Values=vpc Name=tag:Name,Values="${APP_NAME}-nat-eip-1" --query 'Addresses[0].AllocationId' --output text 2>/dev/null || true)"
            NAT_EIP_2_RAW="$(aws ec2 describe-addresses --filters Name=domain,Values=vpc Name=tag:Name,Values="${APP_NAME}-nat-eip-2" --query 'Addresses[0].AllocationId' --output text 2>/dev/null || true)"
          fi
          NAT_EIP_1_ID="$(normalize_none "$NAT_EIP_1_RAW")"
          NAT_EIP_2_ID="$(normalize_none "$NAT_EIP_2_RAW")"

          if [ -z "$NAT_EIP_1_ID" ] && [ -n "$NAT_GW_1_ID" ]; then
            NAT_EIP_1_RAW="$(aws ec2 describe-nat-gateways --nat-gateway-ids "$NAT_GW_1_ID" --query 'NatGateways[0].NatGatewayAddresses[0].AllocationId' --output text 2>/dev/null || true)"
            NAT_EIP_1_ID="$(normalize_none "$NAT_EIP_1_RAW")"
          fi

          if [ -z "$NAT_EIP_2_ID" ] && [ -n "$NAT_GW_2_ID" ]; then
            NAT_EIP_2_RAW="$(aws ec2 describe-nat-gateways --nat-gateway-ids "$NAT_GW_2_ID" --query 'NatGateways[0].NatGatewayAddresses[0].AllocationId' --output text 2>/dev/null || true)"
            NAT_EIP_2_ID="$(normalize_none "$NAT_EIP_2_RAW")"
          fi

          TG_ARN_RAW="$(aws elbv2 describe-target-groups --names "${APP_NAME}-tg" --query 'TargetGroups[0].TargetGroupArn' --output text 2>/dev/null || true)"
          TG_ARN="$(normalize_none "$TG_ARN_RAW")"

          LISTENER_ARN_RAW=""
          if [ -n "$ALB_ARN" ]; then
            LISTENER_ARN_RAW="$(aws elbv2 describe-listeners --load-balancer-arn "$ALB_ARN" --query 'Listeners[?Port==`80`][0].ListenerArn' --output text 2>/dev/null || true)"
          fi
          LISTENER_ARN="$(normalize_none "$LISTENER_ARN_RAW")"

          ECS_SG_RAW=""
          if [ -n "$ALB_VPC_ID" ]; then
            ECS_SG_RAW="$(aws ec2 describe-security-groups --filters Name=group-name,Values="${APP_NAME}-ecs-sg" Name=vpc-id,Values="$ALB_VPC_ID" --query 'SecurityGroups[0].GroupId' --output text 2>/dev/null || true)"
          fi
          ECS_SG_ID="$(normalize_none "$ECS_SG_RAW")"

          LOG_GROUP_RAW="$(aws logs describe-log-groups --log-group-name-prefix "/ecs/${APP_NAME}" --query 'logGroups[0].logGroupName' --output text 2>/dev/null || true)"
          LOG_GROUP_NAME="$(normalize_none "$LOG_GROUP_RAW")"

          TASK_EXEC_ROLE_RAW="$(aws iam get-role --role-name "${APP_NAME}-ecs-task-execution-role" --query 'Role.RoleName' --output text 2>/dev/null || true)"
          TASK_EXEC_ROLE_NAME="$(normalize_none "$TASK_EXEC_ROLE_RAW")"

          TASK_ROLE_RAW="$(aws iam get-role --role-name "${APP_NAME}-ecs-task-role" --query 'Role.RoleName' --output text 2>/dev/null || true)"
          TASK_ROLE_NAME="$(normalize_none "$TASK_ROLE_RAW")"

          DDB_TABLE_RAW="$(aws dynamodb describe-table --table-name "${APP_TABLE_NAME}" --query 'Table.TableName' --output text 2>/dev/null || true)"
          DDB_TABLE_NAME="$(normalize_none "$DDB_TABLE_RAW")"

          ensure_import module.network.aws_vpc.this "$ALB_VPC_ID"
          ensure_import module.network.aws_internet_gateway.this "$IGW_ID"
          ensure_import module.network.aws_subnet.public[0] "$PUBLIC_SUBNET_1"
          ensure_import module.network.aws_subnet.public[1] "$PUBLIC_SUBNET_2"
          ensure_import module.network.aws_subnet.private[0] "$PRIVATE_SUBNET_1"
          ensure_import module.network.aws_subnet.private[1] "$PRIVATE_SUBNET_2"
          ensure_import module.network.aws_route_table.public "$PUBLIC_RT_ID"
          ensure_import module.network.aws_route_table.private[0] "$PRIVATE_RT_1_ID"
          ensure_import module.network.aws_route_table.private[1] "$PRIVATE_RT_2_ID"
          ensure_import module.network.aws_eip.nat[0] "$NAT_EIP_1_ID"
          ensure_import module.network.aws_eip.nat[1] "$NAT_EIP_2_ID"
          ensure_import module.network.aws_nat_gateway.this[0] "$NAT_GW_1_ID"
          ensure_import module.network.aws_nat_gateway.this[1] "$NAT_GW_2_ID"

          if [ -n "$PUBLIC_SUBNET_1" ] && [ -n "$PUBLIC_RT_ID" ]; then
            ensure_import module.network.aws_route_table_association.public[0] "${PUBLIC_SUBNET_1}/${PUBLIC_RT_ID}"
          fi

          if [ -n "$PUBLIC_SUBNET_2" ] && [ -n "$PUBLIC_RT_ID" ]; then
            ensure_import module.network.aws_route_table_association.public[1] "${PUBLIC_SUBNET_2}/${PUBLIC_RT_ID}"
          fi

          if [ -n "$PRIVATE_SUBNET_1" ] && [ -n "$PRIVATE_RT_1_ID" ]; then
            ensure_import module.network.aws_route_table_association.private[0] "${PRIVATE_SUBNET_1}/${PRIVATE_RT_1_ID}"
          fi

          if [ -n "$PRIVATE_SUBNET_2" ] && [ -n "$PRIVATE_RT_2_ID" ]; then
            ensure_import module.network.aws_route_table_association.private[1] "${PRIVATE_SUBNET_2}/${PRIVATE_RT_2_ID}"
          fi

          ensure_import module.alb.aws_lb.this "$ALB_ARN"
          ensure_import module.alb.aws_lb_target_group.ecs "$TG_ARN"
          ensure_import module.dynamodb.aws_dynamodb_table.this "$DDB_TABLE_NAME"
          ensure_import module.ecs.aws_cloudwatch_log_group.app "$LOG_GROUP_NAME"
          ensure_import module.ecs.aws_iam_role.task_execution "$TASK_EXEC_ROLE_NAME"
          ensure_import module.ecs.aws_iam_role.task "$TASK_ROLE_NAME"
          ensure_import module.ecs.aws_ecs_cluster.this "$CLUSTER_NAME"

          if [ -n "$CLUSTER_NAME" ] && [ -n "$SERVICE_STATUS" ] && [ "$SERVICE_STATUS" != "MISSING" ]; then
            ensure_import module.ecs.aws_ecs_service.this "${APP_NAME}-cluster/${APP_NAME}-service"
          fi

          ensure_import module.alb.aws_security_group.alb "$ALB_SG_ID"
          ensure_import module.alb.aws_lb_listener.http "$LISTENER_ARN"
          ensure_import module.ecs.aws_security_group.ecs "$ECS_SG_ID"

          terraform validate
          terraform plan -input=false -out=tfplan
          terraform apply -input=false -auto-approve tfplan
